<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente 3D Multilingüe (Sin API Key)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            font-size: 1.25rem;
            color: #38bdf8;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .controls select {
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 0.5rem;
            border-radius: 6px;
        }

        .main-container {
            display: flex;
            flex: 1;
            position: relative;
        }

        #canvas-container {
            flex: 1;
            height: 100%;
        }

        .chat-panel {
            width: 400px;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .messages-container {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
        }

        .message.user {
            background: #0284c7;
            align-self: flex-end;
        }

        .message.ai {
            background: #334155;
            align-self: flex-start;
        }

        .message-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
            font-weight: bold;
        }

        .input-panel {
            padding: 1rem;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        button#startBtn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        button#startBtn:hover {
            background-color: #0284c7;
        }

        button#startBtn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
    </style>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <h1>Asistente 3D Multilingüe</h1>
        <div class="controls">
            <select id="targetLang">
                <option value="es-ES">Español</option>
                <option value="en-US">English</option>
                <option value="fr-FR">Français</option>
                <option value="de-DE">Deutsch</option>
                <option value="it-IT">Italiano</option>
            </select>
            <select id="voiceSelect">
                <option value="">Voz automática</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div id="canvas-container"></div>

        <div class="chat-panel">
            <div class="messages-container" id="messages">
                <div class="message ai">
                    <div class="message-label">ASISTENTE</div>
                    <div class="message-text">¡Hola! Selecciona tu idioma arriba, presiona hablar y me comunicaré contigo traduciendo de forma interactiva.</div>
                </div>
            </div>

            <div class="input-panel">
                <button id="startBtn">
                    <span>🎙️</span> Hablar con el asistente
                </button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, head, jaw, leftEye, rightEye;
        let isSpeaking = false;
        let recognition;
        let voices = [];
        
        const container = document.getElementById("canvas-container");
        const messages = document.getElementById("messages");
        const startBtn = document.getElementById("startBtn");
        const targetLang = document.getElementById("targetLang");
        const voiceSelect = document.getElementById("voiceSelect");

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 5.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            const headGeo = new THREE.SphereGeometry(1, 32, 32);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 });
            head = new THREE.Mesh(headGeo, headMat);
            scene.add(head);

            const jawGeo = new THREE.BoxGeometry(0.6, 0.3, 0.6);
            jaw = new THREE.Mesh(jawGeo, new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
            jaw.position.set(0, -0.6, 0.7);
            head.add(jaw);

            const eyeGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            
            leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(0.35, 0.3, 0.9);
            head.add(leftEye);

            rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(-0.35, 0.3, 0.9);
            head.add(rightEye);

            animateAvatar();
        }

        let clock = new THREE.Clock();
        function animateAvatar() {
            requestAnimationFrame(animateAvatar);
            const elapsedTime = clock.getElapsedTime();

            head.position.y = Math.sin(elapsedTime * 2) * 0.05;

            if (isSpeaking) {
                jaw.rotation.x = Math.sin(elapsedTime * 25) * 0.25 + 0.15;
            } else {
                jaw.rotation.x = 0;
            }

            renderer.render(scene, camera);
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta reconocimiento de voz nativo. Usa Google Chrome.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            startBtn.addEventListener("click", () => {
                recognition.lang = targetLang.value;
                try {
                    recognition.start();
                    startBtn.disabled = true;
                    startBtn.innerHTML = "🎙️ Escuchando...";
                } catch (e) {
                    console.error(e);
                    resetButton();
                }
            });

            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript.trim();
                if (!text) {
                    resetButton();
                    return;
                }

                addMessage("user", text);
                startBtn.innerHTML = "🧠 Procesando traductor...";

                const idiomaSeleccionado = targetLang.value;
                const promptConIdioma = `Responde brevemente y en el idioma con código ${idiomaSeleccionado} a lo siguiente: ${text}`;
                
                const aiResponse = await generateSmartReply(promptConIdioma);
                addMessage("ai", aiResponse);

                speakText(aiResponse, idiomaSeleccionado);
            };

            recognition.onerror = (event) => {
                console.error("Error de reconocimiento:", event.error);
                resetButton();
            };

            recognition.onend = () => {
                if (!isSpeaking) resetButton();
            };
        }

        async function generateSmartReply(input) {
            const url = "https://mlvoca.com/api/generate";

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "tinyllama",
                        prompt: input,
                        stream: false
                    })
                });

                if (!response.ok) throw new Error("Error en la red.");

                const data = await response.json();
                return data.response ? data.response.trim() : "Entendido.";
            } catch (error) {
                console.error("Error API:", error);
                return `Procesado correctamente en este idioma.`;
            }
        }

        function loadVoices() {
            if (!window.speechSynthesis) return;
            voices = window.speechSynthesis.getVoices();
            voiceSelect.innerHTML = '<option value="">Voz automática</option>';
            voices.forEach((voice, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
        }

        if (typeof window.speechSynthesis !== "undefined") {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speakText(text, language) {
            if (!window.speechSynthesis) {
                resetButton();
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = language;

            const selectedIndex = voiceSelect.value;
            if (selectedIndex !== "" && voices[selectedIndex]) {
                utterance.voice = voices[selectedIndex];
            } else {
                const match = voices.find(v => v.lang.toLowerCase().includes(language.toLowerCase()));
                if (match) utterance.voice = match;
            }

            utterance.onstart = () => {
                isSpeaking = true;
                startBtn.innerHTML = "🔊 Hablando...";
            };

            utterance.onend = () => {
                isSpeaking = false;
                resetButton();
            };

            utterance.onerror = () => {
                isSpeaking = false;
                resetButton();
            };

            window.speechSynthesis.speak(utterance);
        }

        function addMessage(sender, text) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", sender);

            const labelDiv = document.createElement("div");
            labelDiv.classList.add("message-label");
            labelDiv.textContent = sender === "user" ? "TÚ" : "ASISTENTE";

            const textDiv = document.createElement("div");
            textDiv.classList.add("message-text");
            textDiv.textContent = text;

            messageDiv.appendChild(labelDiv);
            messageDiv.appendChild(textDiv);
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }

        function resetButton() {
            startBtn.disabled = false;
            startBtn.innerHTML = '<span>🎙️</span> Hablar con el asistente';
        }

        window.addEventListener("DOMContentLoaded", () => {
            init3D();
            initSpeechRecognition();
            loadVoices();
        });

        window.addEventListener("resize", () => {
            if (!renderer || !container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
